[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "compression-radar-paper"
version = "6.1.3"
description = "Experimental crypto failed-auction paper research runtime"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.13.5"]
[project.scripts]
compression-radar = "radar.__main__:main"
[tool.setuptools.packages.find]
include = ["radar*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
radar = ["dashboard.html"]
